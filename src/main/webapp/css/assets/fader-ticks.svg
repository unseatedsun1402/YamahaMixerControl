<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 20 100"
     preserveAspectRatio="none">

  <!-- Major ticks -->
  <g stroke="rgba(255,255,255,0.55)" stroke-width="2">
    <line x1="0"  y1="0"   x2="20" y2="0" />
    <line x1="0"  y1="20"  x2="20" y2="20" />
    <line x1="0"  y1="40"  x2="20" y2="40" />
    <line x1="0"  y1="60"  x2="20" y2="60" />
    <line x1="0"  y1="80"  x2="20" y2="80" />
    <line x1="0"  y1="100" x2="20" y2="100" />
  </g>

  <!-- Minor ticks (3 per major block) -->
  <g stroke="rgba(255,255,255,0.25)" stroke-width="1.2">
    <line x1="10" y1="5"  x2="20" y2="5" />
    <line x1="10" y1="10" x2="20" y2="10" />
    <line x1="10" y1="15" x2="20" y2="15" />

    <line x1="10" y1="25" x2="20" y2="25" />
    <line x1="10" y1="30" x2="20" y2="30" />
    <line x1="10" y1="35" x2="20" y2="35" />

    <line x1="10" y1="45" x2="20" y2="45" />
    <line x1="10" y1="50" x2="20" y2="50" />
    <line x1="10" y1="55" x2="20" y2="55" />

    <line x1="10" y1="65" x2="20" y2="65" />
    <line x1="10" y1="70" x2="20" y2="70" />
    <line x1="10" y1="75" x2="20" y2="75" />

    <line x1="10" y1="85" x2="20" y2="85" />
    <line x1="10" y1="90" x2="20" y2="90" />
    <line x1="10" y1="95" x2="20" y2="95" />
  </g>

</svg>