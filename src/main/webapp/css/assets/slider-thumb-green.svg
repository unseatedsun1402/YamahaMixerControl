<svg xmlns="http://www.w3.org/2000/svg"
     width="24"
     height="26"
     viewBox="0 0 24 26">

  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6e6e6"/>
      <stop offset="45%" stop-color="#bbbbbb"/>
      <stop offset="100%" stop-color="#dcdcdc"/>
    </linearGradient>

    <linearGradient id="sideShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#444" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <path d="
      M 6 1
      L 18 1
      C 20.5 1 22.5 3 22.5 5.5
      L 22.5 20.5
      C 22.5 23 20.5 25 18 25
      L 6 25
      C 3.5 25 1.5 23 1.5 20.5
      L 1.5 5.5
      C 1.5 3 3.5 1 6 1
      Z"
    fill="url(#body)"
    stroke="#333"
    stroke-width="1.2"/>


    <!-- Left highlight -->
    <rect x="3" y="3"
        width="1"
        height="20"
        fill="#fff"
        opacity="0.12"/>

    <!-- Right shadow -->
    <rect x="20" y="3"
        width="1"
        height="20"
        fill="url(#sideShade)"/>

    <!-- Accent stripe -->
    <rect x="5"
        y="11"
        width="14"
        height="2"
        rx="2"
        fill="#22c55e"/>

</svg>