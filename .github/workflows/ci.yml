name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: gradle/actions/setup-gradle@v4
      - name: Python syntax
        run: python -W error -m compileall -q src/main/python .github/hooks
      - name: Java lint (javac -Xlint -Werror)
        run: ./gradlew lintJava --console=plain

  unit-tests:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 18
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew unitTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: build/reports/tests/unitTest

  functional-tests:
    name: Functional tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 18
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew functionalTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-test-reports
          path: build/reports/tests/functionalTest
