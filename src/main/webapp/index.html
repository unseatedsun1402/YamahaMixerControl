<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan to Access</title>
  <link rel="stylesheet" href="css/index-style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
  <header class="page-header">
    <div>
      <p class="page-kicker">Yamaha Mixer Control</p>
      <h1>Scan to Access Mixer Pages</h1>
    </div>
    <a class="page-nav-link" href="main.html">Back to Console</a>
  </header>

  <main class="qr-grid" aria-label="Mixer page QR codes">
    <a class="qr-card" href="main.html">
      <span class="qr-code" id="qr-main" aria-hidden="true"></span>
      <span class="qr-label">Mixer</span>
      <span class="qr-description">Main console controls</span>
    </a>

    <a class="qr-card" href="settings.html">
      <span class="qr-code" id="qr-settings" aria-hidden="true"></span>
      <span class="qr-label">Settings</span>
      <span class="qr-description">MIDI and server settings</span>
    </a>

    <a class="qr-card" href="meters.html">
      <span class="qr-code" id="qr-meters" aria-hidden="true"></span>
      <span class="qr-label">Meters</span>
      <span class="qr-description">Metering display</span>
    </a>

    <a class="qr-card" href="bus.html">
      <span class="qr-code" id="qr-bus" aria-hidden="true"></span>
      <span class="qr-label">Buses</span>
      <span class="qr-description">Bus controls</span>
    </a>
  </main>

  <script>
    // Fetch the server base URL from your servlet
  const contextPath = window.location.pathname.split('/')[1];
  const serveUrl = `http://${location.host}/${contextPath}/get-server-ip`;
  fetch(serveUrl)
      .then(r => r.text())
      .then(txt => {
        const data = JSON.parse(txt);
        const base = data.payload;

        const pages = ["main", "settings", "meters", "bus"];
        pages.forEach(page => {
          new QRCode(document.getElementById(`qr-${page}`), `${base}/${page}.html`);
        });
      })
      .catch(err => console.error("QR init failed: "+ err));
  </script>

</body>
</html>
