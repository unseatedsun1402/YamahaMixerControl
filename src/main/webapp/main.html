<!DOCTYPE html>
<html>
<head>
    <title>Input Mix UI</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/mix-vars.css"/>
    <link rel="stylesheet" href="css/basic-view-style.css"/>
    <link rel="stylesheet" href="css/sof-panel-style.css"/>
    <link rel="stylesheet" href="css/fader-style.css"/>
    <link rel="stylesheet" href="css/widgets/generic.css"/>
    <link rel="stylesheet" href="css/control-colors.css"/>
    <link rel="stylesheet" href="css/widgets/dynamics-widget.css"/>
    <link rel="stylesheet" href="css/widgets/eq-widget.css"/>
    <link rel="stylesheet" href="css/mix-phone-landscape.css"/>
    <link rel="stylesheet" href="css/authentication.css"/>
    <link rel="stylesheet" href="css/page-navigation.css"/>


    <script type="module">
        import { WebSocketClient } from './js/websocketClient.js';
        import { renderUiModel, setStripContexts } from './js/new-ui-renderer.js';
        import { applyControlUpdate } from './js/partial-update.js';
        import { buildViewRibbonFromModel } from './js/view-ribbon.js';
        import { updateChannelStripName } from './js/utils/channel-name.js';
        import { DeskStatusWidget } from "./js/widgets/liveness.js";
        import { installAuthentication } from "./js/authentication.js";
        
        window.ribbonInitialised = false;
        window.lastBankContexts= [];
        
        window.allContexts = [];
        window.currentBank = 0;
        window.channelsPerBank = 8;
        window.currentView = "basic-input-view";
        window.currentDomain = "input";
        window.channelMeters = new Map();

        
        console.log(">>> MidiControl UI bootstrap running <<<");

        const contextPath = window.location.pathname.split('/')[1];
        const wsUrl = `ws://${location.host}/${contextPath}/endpoint`;

        const ws = new WebSocketClient(wsUrl);
        installAuthentication(ws);
        const deskStatusWidget = new DeskStatusWidget(document.getElementById("desk-status"));
        let pendingModels = new Map();

        ws.on("connected", () => {
            console.info("[Bootstrap] Connected — requesting bank.inputs…");
            ws.requestBank("bank.inputs");
            ws.sendMeterKeepAlive();

            if (!ws.keepAliveInterval) {
                ws.keepAliveInterval = setInterval(() => {
                    ws.sendMeterKeepAlive();
                }, 10000);
            }
            
            ws.setSessionType("control");
            console.info(`[Mix] Registering session type ${ws.sessionType}`);
        });


        function selectOutputMode() {

            pendingModels.clear();
            setStripContexts([]);
            window.currentDomain = "output";
            updateModeButtonState();
            window.currentView = "basic-master-view";
            
            window.currentBank = 0;
            window.ribbonInitialised = false;

            ws.requestBank("bank.mixes");
        }


        function selectInputMode() {

            pendingModels.clear();
            setStripContexts([]);
            window.currentDomain ="input";
            updateModeButtonState();
            window.currentView ="basic-input-view";
            
            window.currentBank = 0;
            window.ribbonInitialised = false;

            ws.requestBank("bank.inputs" );
        }

        function handleViewSelection(sendId) {

            const view = sendId
                ? `basic-sends-on-fader-view:${sendId}`
                : "basic-input-view";

            window.currentView = view;

            loadBank(window.currentBank);
        }

        function loadBank(bankIndex) {
            window.currentBank = bankIndex;    
            console.log("Loading bank", bankIndex);

            document.querySelectorAll("#bank-selector .bank-btn[data-bank-index]").forEach(button => {
                const isActive = Number(button.dataset.bankIndex) === bankIndex;
                button.classList.toggle("active", isActive);
                button.setAttribute("aria-pressed", String(isActive));
            });

            const start = bankIndex * window.channelsPerBank;
            const end = start + window.channelsPerBank;

            const visibleContexts =
                window.allContexts.slice(start, end);
            console.log("Contexts", visibleContexts);
            
            setStripContexts(visibleContexts);
            pendingModels = new Map();

            for (const ctxId of visibleContexts) {
                pendingModels.set(ctxId, ws.requestUiModel(ctxId, window.currentView));
            }
            ws.requestChannelNames();
        }

        function buildBankSelector() {
            const container =
                document.getElementById("bank-selector");

            container.innerHTML = "";

            const modeControls = document.createElement("div");
            modeControls.className = "bank-mode-controls";
            for (const [domain, label, selectMode] of [
                ["input", "INPUT", selectInputMode],
                ["output", "OUTPUT", selectOutputMode]
            ]) {
                const modeButton = document.createElement("button");
                modeButton.type = "button";
                modeButton.className = "soft-key bank-mode-btn";
                modeButton.textContent = label;
                modeButton.dataset.domain = domain;
                modeButton.setAttribute("aria-pressed", "false");
                modeButton.addEventListener("click", selectMode);
                modeControls.appendChild(modeButton);
            }
            container.appendChild(modeControls);

            const divider = document.createElement("div");
            divider.className = "bank-selector-divider";
            divider.setAttribute("aria-hidden", "true");
            container.appendChild(divider);

            const banks =
                Math.ceil(
                    window.allContexts.length /
                    window.channelsPerBank
                );

            for (let i = 0; i < banks; i++) {

                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "soft-key bank-btn";
                btn.dataset.bankIndex = String(i);

                const start = (i * window.channelsPerBank) + 1;
                const end = Math.min(
                    start + window.channelsPerBank - 1,
                    window.allContexts.length
                );

                btn.textContent = `${start}-${end}`;
                btn.setAttribute("aria-label", `Channels ${start} through ${end}`);
                btn.setAttribute("aria-pressed", String(i === window.currentBank));

                btn.onclick = () => loadBank(i);

                container.appendChild(btn);
            }
            updateModeButtonState();
        }

        function updateModeButtonState() {
            document.querySelectorAll("#bank-selector .bank-mode-btn").forEach(button => {
                const isActive = button.dataset.domain === window.currentDomain;
                button.classList.toggle("active", isActive);
                button.setAttribute("aria-pressed", String(isActive));
            });
        }
        
        ws.on("ui-bank", (bank) => {
            const expectedBank = window.currentDomain === "output" ? "bank.mixes" : "bank.inputs";
            if (bank.contextId !== expectedBank) {
                console.debug("[Bootstrap] Ignoring bank for inactive mode:", bank.contextId);
                return;
            }

            window.allContexts = bank.contexts;

            for (const ctxId of bank.contexts) {
                ws.subscribe(ctxId);
                console.log("Subscribed to "+ctxId);
            }

            buildBankSelector();
            loadBank(0);
        });

        ws.on("meter-update", (payload) => {
            const ctxId = `channel.${payload.offset}`;
            const meter = window.channelMeters?.get(ctxId);

            if (meter) {
                meter.update(
                    payload.value,
                    payload.dB,
                    payload.is14Bit,
                    payload.offset
                );
            }
        });

        ws.on("ui-model", (model) => {

            console.log("UI MODEL RECEIVED", model.contextId);
            if (pendingModels.get(model.contextId) !== model.__meta?.requestId) {
                console.debug("[Bootstrap] Ignoring stale UI model:", model.contextId);
                return;
            }
            pendingModels.delete(model.contextId);

            if (!window.ribbonInitialised) {
                buildViewRibbonFromModel(
                    model,
                    handleViewSelection
                );
                window.ribbonInitialised = true;
            }
            
            renderUiModel(model);
            const container = document.getElementById("strip-container");
            const order = window.allContexts.slice(
                window.currentBank * window.channelsPerBank,
                (window.currentBank + 1) * window.channelsPerBank
            );
            const strip = Array.from(container.children)
                .find(element => element.dataset.contextId === model.contextId);
            const next = Array.from(container.children)
                .find(element => order.indexOf(element.dataset.contextId) > order.indexOf(model.contextId));
            if (strip && next) container.insertBefore(strip, next);
        });

        ws.on("control-update", (payload) => {
            console.debug("[Bootstrap] Control update:", payload);
            applyControlUpdate(payload);
        });

        ws.on("name-update", (payload) => {
            const fromContext = payload["context-id"];

            const parts = fromContext.split(".");
            const index = parts[2];

            const uiContextId = `channel.${index}`;

            console.debug("[NAME MAP]", fromContext, "→", uiContextId);

            updateChannelStripName(uiContextId, payload.name);
        });

        ws.on("error", (err) => {
            console.error("[Bootstrap] Error from server:", err);
        });

        ws.on("REGISTRY_CHANGED", (payload) => {
            console.info("[Bootstrap] Registry changed:", payload);
            pendingModels.clear();
            setStripContexts([]);
            window.ribbonInitialised = false;
            ws.requestBank(window.currentDomain === "output" ? "bank.mixes" : "bank.inputs");
        });

        ws.on("server-event", handleServerEvent)
        
        function handleServerEvent(event) {
            if (event.category === "LIVENESS") {
                deskStatusWidget.update(event);
            }
        }

        ws.connect();
        window.wsClient = ws;
    </script>
</head>

<body>
    <div id="ui-root">
        <div id="view-ribbon"><div id="desk-status" role="status" aria-live="polite"></div></div>
        <div id="bank-selector"></div>
        <div id="strip-container"></div>
    </div>

</body>

</html>
