<!DOCTYPE html>
<html>
<head>
    <title>Input Mix UI</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/basic-view-style.css"/>
    <link rel="stylesheet" href="css/sof-panel-style.css"/>
    <link rel="stylesheet" href="css/fader-style.css"/>


    <script type="module">
        import { WebSocketClient } from './js/websocketClient.js';
        import { renderUiModel } from './js/new-ui-renderer.js';
        import { applyControlUpdate } from './js/partial-update.js';
        import { buildSofPanelFromModel } from './js/sof-panel.js';
        import { updateChannelStripName } from './js/utils/channel-name.js';
        window.sofInitialised = false;
        window.lastBankContexts= [];
        
        console.log(">>> MidiControl UI bootstrap running <<<");

        // Build WebSocket URL
        const contextPath = window.location.pathname.split('/')[1];
        const wsUrl = `ws://${location.host}/${contextPath}/endpoint`;

        // Create WebSocket client
        const ws = new WebSocketClient(wsUrl);

        ws.on("connected", () => {
            console.info("[Bootstrap] Connected — requesting bank.inputs…");
            ws.requestBank("bank.inputs");
        });

        function handleSofSelection(sendId) {
            const stripContainer = document.getElementById("strip-container");

            const view = sendId
                ? `basic-sends-on-fader-view:${sendId}`
                : "basic-input-view";

            for (const ctxId of window.lastBankContexts) {
                ws.requestUiModel(ctxId, view);
            }
            ws.requestChannelNames();
        }
        
        ws.on("ui-bank", (bank) => {
            console.info("[Bootstrap] Bank received:", bank);
            window.lastBankContexts = bank.contexts;

            const stripContainer = document.getElementById("strip-container");
            stripContainer.innerHTML = "";

            for (const ctxId of bank.contexts) {
                console.info(`[Bootstrap] Requesting model for ${ctxId}`);
                ws.requestUiModel(ctxId, "basic-input-view");
                ws.subscribe(ctxId);
            }
        });

        ws.on("ui-model", (model) => {
            if (!window.sofInitialised) {
                buildSofPanelFromModel(model, handleSofSelection);
                window.sofInitialised = true;
            }
            renderUiModel(model);
        });

        ws.on("control-update", (payload) => {
            console.debug("[Bootstrap] Control update:", payload);
            applyControlUpdate(payload);
        });

        ws.on("name-update", (payload) => {
            const fromContext = payload["context-id"];   // e.g. "name.28"
            const [, indexStr] = fromContext.split("."); // "28"
            const channelContextId = `channel.${indexStr}`;

            updateChannelStripName(channelContextId, payload.name);
        });

        ws.on("error", (err) => {
            console.error("[Bootstrap] Error from server:", err);
        });

        ws.connect();
        window.wsClient = ws;
    </script>
</head>

<body>
    <div id="ui-root">
        <div id="sof-panel"></div>
        <div id="strip-container"></div>
    </div>

</body>

</html>
