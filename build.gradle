plugins {
    
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.apache.tomcat.embed:tomcat-embed-websocket'
    implementation 'org.jmdns:jmdns:3.5.10'

    // Align all JUnit modules
    testImplementation platform('org.junit:junit-bom:5.10.2')

    // API + annotations
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.awaitility:awaitility:4.3.0'

    // Runtime engine + launcher (must be explicit!)
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    implementation group: 'com.google.code.gson', name: 'gson', version: '2.10.1'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'
    implementation group: 'com.google.zxing', name: 'javase', version:'3.5.1'
    implementation 'com.google.zxing:core:3.5.1'
}

tasks.named('processResources') {
    from('src/main/webapp') {
        into 'static'
        exclude 'WEB-INF/**'
        exclude 'META-INF/**'
    }
}

tasks.named('jar') {
    enabled = false
}

tasks.register('packageWindowsApp', Exec) {
    dependsOn tasks.named('bootJar')

    def appName = 'YamahaMixerControl'
    def outputDirectory = layout.buildDirectory.dir("desktop/${appName}").get().asFile
    def destinationDirectory = outputDirectory.parentFile
    def jpackageExecutable = new File(System.getProperty('java.home'), 'bin/jpackage.exe')
    def bootJarFile = tasks.named('bootJar').get().archiveFile.get().asFile

    inputs.file(bootJarFile)
    outputs.dir(outputDirectory)

    doFirst {
        if (!jpackageExecutable.isFile()) {
            throw new GradleException(
                    "jpackage was not found at ${jpackageExecutable}. Run this task with a JDK 18 or newer."
            )
        }
        outputDirectory.deleteDir()
    }

    commandLine(
            jpackageExecutable.absolutePath,
            '--type', 'app-image',
            '--name', appName,
            '--input', bootJarFile.parentFile.absolutePath,
            '--main-jar', bootJarFile.name,
            '--main-class', 'org.springframework.boot.loader.launch.JarLauncher',
            '--java-options', '-Djava.awt.headless=false',
            '--dest', destinationDirectory.absolutePath
    )
}

springBoot {
    mainClass = 'MidiControl.MidiControlApplication'
}

java {
    sourceCompatibility = JavaVersion.VERSION_18
    targetCompatibility = JavaVersion.VERSION_18
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

test {
    useJUnitPlatform {
        excludeTags 'stress'
    }
}

tasks.register('unitTest', Test) {
    description = 'Runs unit tests (MidiControl.unit.*).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        excludeTags 'stress'
    }
    include 'MidiControl/unit/**'
}

tasks.register('functionalTest', Test) {
    description = 'Runs functional and integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        excludeTags 'stress'
    }
    include 'MidiControl/functional/**', 'MidiControl/integration/**'
}

// Basic javac lint (JDK built-in): any lint warning fails the build.
tasks.register('lintJava') {
    description = 'Compiles main and test sources with -Xlint and -Werror.'
    group = 'verification'
    dependsOn 'lintMainJava', 'lintTestJava'
}

tasks.register('lintMainJava', JavaCompile) {
    source = sourceSets.main.java
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('lint/main')
    options.annotationProcessorPath = sourceSets.main.annotationProcessorPath
    options.compilerArgs += ['-Xlint:cast,deprecation,removal,unchecked,rawtypes,try,fallthrough,empty,dep-ann,overrides,static,varargs,finally', '-Werror']
}

tasks.register('lintTestJava', JavaCompile) {
    source = sourceSets.test.java
    classpath = sourceSets.test.compileClasspath + files(sourceSets.main.output)
    destinationDirectory = layout.buildDirectory.dir('lint/test')
    options.annotationProcessorPath = sourceSets.test.annotationProcessorPath
    options.compilerArgs += ['-Xlint:cast,deprecation,removal,unchecked,rawtypes,try,fallthrough,empty,dep-ann,overrides,static,varargs,finally', '-Werror']
}

tasks.register('stressTest', Test) {
    description = 'Runs opt-in MIDI send pipeline stress tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'stress'
    }
    testLogging {
        showStandardStreams = true
    }
}
