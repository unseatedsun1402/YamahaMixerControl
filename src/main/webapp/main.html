<!DOCTYPE html>
<html>
<head>
    <title>Input Mix UI</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/basic-view-style.css"/>
    <link rel="stylesheet" href="css/sof-panel-style.css"/>
    <link rel="stylesheet" href="css/fader-style.css"/>
    <link rel="stylesheet" href="css/widgets/generic.css"/>
    <link rel="stylesheet" href="css/widgets/dynamics-widget.css"/>
    <link rel="stylesheet" href="css/widgets/eq-widget.css"/>


    <script type="module">
        import { WebSocketClient } from './js/websocketClient.js';
        import { renderUiModel } from './js/new-ui-renderer.js';
        import { applyControlUpdate } from './js/partial-update.js';
        import { buildViewRibbonFromModel } from './js/view-ribbon.js';
        import { updateChannelStripName } from './js/utils/channel-name.js';
        
        window.ribbonInitialised = false;
        window.lastBankContexts= [];
        
        window.allContexts = [];
        window.currentBank = 0;
        window.channelsPerBank = 8;
        window.currentView = "basic-input-view";
        window.channelMeters = new Map();

        
        console.log(">>> MidiControl UI bootstrap running <<<");

        const contextPath = window.location.pathname.split('/')[1];
        const wsUrl = `ws://${location.host}/${contextPath}/endpoint`;

        const ws = new WebSocketClient(wsUrl);

        ws.on("connected", () => {
            console.info("[Bootstrap] Connected — requesting bank.inputs…");
            ws.requestBank("bank.inputs");
            ws.sendMeterKeepAlive();

            if (!ws.keepAliveInterval) {
                ws.keepAliveInterval = setInterval(() => {
                    ws.sendMeterKeepAlive();
                }, 10000);
            }
            
            ws.setSessionType("control");
            console.info(`[Mix] Registering session type ${ws.sessionType}`);
        });

        function handleViewSelection(sendId) {

            const view = sendId
                ? `basic-sends-on-fader-view:${sendId}`
                : "basic-input-view";

            window.currentView = view;

            loadBank(window.currentBank);
        }

        function loadBank(bankIndex) {
            window.currentBank = bankIndex;    
            console.log("Loading bank", bankIndex);

            const start = bankIndex * window.channelsPerBank;
            const end = start + window.channelsPerBank;

            const visibleContexts =
                window.allContexts.slice(start, end);
            console.log("Contexts", visibleContexts);
            
            const stripContainer =
                document.getElementById("strip-container");

            stripContainer.innerHTML = "";

            for (const ctxId of visibleContexts) {
                ws.requestUiModel(ctxId, window.currentView);
            }
            ws.requestChannelNames();
        }

        function buildBankSelector() {
            const container =
                document.getElementById("bank-selector");

            container.innerHTML = "";

            const banks =
                Math.ceil(
                    window.allContexts.length /
                    window.channelsPerBank
                );

            for (let i = 0; i < banks; i++) {

                const btn = document.createElement("button");

                const start = (i * 8) + 1;
                const end = Math.min(
                    start + 7,
                    window.allContexts.length
                );

                btn.textContent = `${start}-${end}`;

                btn.onclick = () => loadBank(i);

                container.appendChild(btn);
            }
        }
        
        ws.on("ui-bank", (bank) => {

            window.allContexts = bank.contexts;

            for (const ctxId of bank.contexts) {
                ws.subscribe(ctxId);
                console.log("Subscribed to "+ctxId);
            }

            buildBankSelector();
            loadBank(0);
        });

        ws.on("meter-update", (payload) => {
            const ctxId = `channel.${payload.offset}`;
            const meter = window.channelMeters?.get(ctxId);

            if (meter) {
                meter.update(
                    payload.value,
                    payload.dB,
                    payload.is14Bit,
                    payload.offset
                );
            }
        });

        ws.on("ui-model", (model) => {

            console.log("UI MODEL RECEIVED", model.contextId);

            if (!window.ribbonInitialised) {
                buildViewRibbonFromModel(model, handleViewSelection);
                window.ribbonInitialised = true;
            }

            renderUiModel(model);
        });

        ws.on("control-update", (payload) => {
            console.debug("[Bootstrap] Control update:", payload);
            applyControlUpdate(payload);
        });

        ws.on("name-update", (payload) => {
            const fromContext = payload["context-id"];

            const parts = fromContext.split(".");
            const index = parts[2];

            const uiContextId = `channel.${index}`;

            console.debug("[NAME MAP]", fromContext, "→", uiContextId);

            updateChannelStripName(uiContextId, payload.name);
        });

        ws.on("error", (err) => {
            console.error("[Bootstrap] Error from server:", err);
        });

        ws.on("REGISTRY_CHANGED", (payload) => {
            console.info("[Bootstrap] Registry changed:", payload);
        });

        ws.connect();
        window.wsClient = ws;
    </script>
</head>

<body>
    <div id="ui-root">
        <div id="view-ribbon"></div>
        <div id="bank-selector"></div>
        <div id="strip-container"></div>
    </div>

</body>

</html>
