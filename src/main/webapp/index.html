<!DOCTYPE html>
<html>
<head>
  <title>Scan to Access</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
  <h1 style="text-align: center;">Scan to Access Mixer Pages</h1>

  <div class="qr-grid" style="text-align:center">

    <div class="qr-item">

      <div class="qr-row">
        <a href="main.html">
          <div id="qr-main"></div>
          <label>main.html</label>
        </a>
      </div>

      <div class="qr-row">
        <a href="settings.html">
          <div id="qr-settings"></div>
          <label>settings.html</label>
        </a>

        <a href="meters.html">
          <div id="qr-meters"></div>
          <label>meters.html</label>
        </a>

        <a href="bus.html">
          <div id="qr-bus"></div>
          <label>buses.html</label>
        </a>

        <!-- <a href="sendsOnFader.html">
          <div id="qr-sends"></div>
          <label>sends.html</label>
        </a> -->
      </div>
    </div>

  </div>

  <script>
    // Fetch the server base URL from your servlet
  const contextPath = window.location.pathname.split('/')[1];
  const serveUrl = `http://${location.host}/${contextPath}/get-server-ip`;
  fetch(serveUrl)
      .then(r => r.text())
      .then(txt => {
        const data = JSON.parse(txt);
        const base = data.payload;

        // Generate QR codes using the dynamic base
        new QRCode(document.getElementById("qr-main"), base + "/main.html");
        new QRCode(document.getElementById("qr-settings"), base + "/settings.html");
        new QRCode(document.getElementById("qr-meters"), base + "/meters.html");
        new QRCode(document.getElementById("qr-bus"), base + "/bus.html");
        new QRCode(document.getElementById("qr-sends"), base + "/sendsOnFader.html");
      })
      .catch(err => console.error("QR init failed: "+ err));
  </script>

</body>
</html>
